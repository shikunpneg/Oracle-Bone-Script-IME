[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-bone-ime-server"
version = "0.1.0"
description = "甲骨文输入法后端服务 - 字转图渲染 + OCR 反向识别"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Oracle-Bone-Script-IME 团队" }
]
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "Pillow>=10.0.0",
  "fonttools>=4.50.0",
  "brotli>=1.1.0",
  "onnxruntime>=1.17.0",
  "pydantic>=2.5.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.26",
  "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["app"]