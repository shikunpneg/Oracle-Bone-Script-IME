name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Run tests
        run: |
          cd server
          pytest tests/ -v --tb=short

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install black isort flake8

      - name: Check formatting
        run: |
          black --check server/
          isort --check-only server/
          flake8 server/ --max-line-length=100 --ignore=E501,W503

  test-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python -c "import json; json.load(open('extension/manifest.json'))"
          echo "✓ manifest.json is valid JSON"

      - name: Check JS syntax
        run: |
          node --check extension/background.js || true
          node --check extension/content.js || true
          node --check extension/popup.js || true

  build-rime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate RIME schema
        run: |
          python -c "import yaml; yaml.safe_load(open('rime/jiaguwen.schema.yaml'))"
          echo "✓ schema.yaml is valid YAML"

      - name: Validate RIME dict
        run: |
          python -c "import yaml; yaml.safe_load(open('rime/jiaguwen.dict.yaml'))"
          echo "✓ dict.yaml is valid YAML"

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd web
          npm install

      - name: Build
        run: |
          cd web
          npm run build